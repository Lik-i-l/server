<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать книгу | Библиотека</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        h1::before {
            content: "📝 ";
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .form-group input[readonly] {
            background: #f8f9fa;
            cursor: not-allowed;
            border-color: #e0e0e0;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }

        .btn-edit {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: #333;
        }

        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
        }

        .btn-back {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            color: white;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 30px;
        }

        .form-actions .btn {
            flex: 1;
            text-align: center;
        }

        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
        }

        #message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        #message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .required {
            color: #dc3545;
            margin-left: 5px;
        }

        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .info-badge {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            color: #1976d2;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Редактирование книги</h1>
    <div class="subtitle">✏️ Внесите необходимые изменения ✏️</div>

    <div class="info-badge" id="book-info">
        📖 Загрузка информации о книге...
    </div>

    <form id="edit-form">
        <div class="form-group">
            <label>📖 ISBN <span class="required">*</span></label>
            <input type="text" id="isbn" placeholder="ISBN" readonly>
            <div class="hint">ISBN нельзя изменить</div>
        </div>

        <div class="form-group">
            <label>📚 Название <span class="required">*</span></label>
            <input type="text" id="name" placeholder="Введите название книги" required>
        </div>

        <div class="form-group">
            <label>✍️ Автор <span class="required">*</span></label>
            <input type="text" id="author" placeholder="Введите автора" required>
        </div>

        <div class="form-group">
            <label>📄 Количество страниц</label>
            <input type="number" id="pages" placeholder="Например: 350">
        </div>

        <div class="form-group">
            <label>📅 Год издания</label>
            <input type="number" id="year" placeholder="Например: 2020">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-edit">💾 Сохранить изменения</button>
            <a href="/" class="btn btn-back">🏠 На главную</a>
        </div>
    </form>

    <div id="message"></div>
</div>

<script>
    // Получаем ISBN из URL
    const urlParams = new URLSearchParams(window.location.search);
    const isbn = urlParams.get('isbn');

    const form = document.getElementById('edit-form');
    const messageDiv = document.getElementById('message');
    const bookInfoDiv = document.getElementById('book-info');

    // Загрузка данных книги
    async function loadBook() {
        try {
            const response = await fetch(`/api/books/${isbn}`);
            if (response.ok) {
                const book = await response.json();
                document.getElementById('isbn').value = book.isbn;
                document.getElementById('name').value = book.name;
                document.getElementById('author').value = book.author;
                document.getElementById('pages').value = book.pages;
                document.getElementById('year').value = book.year;
                bookInfoDiv.innerHTML = `📖 Редактируется: "${book.name}" — ${book.author}`;
            } else {
                bookInfoDiv.className = 'error';
                bookInfoDiv.innerHTML = '❌ Книга не найдена';
            }
        } catch (err) {
            bookInfoDiv.className = 'error';
            bookInfoDiv.innerHTML = '❌ Ошибка загрузки данных';
        }
    }

    // Отправка обновлённых данных
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const updatedBook = {
            isbn: document.getElementById('isbn').value,
            name: document.getElementById('name').value.trim(),
            author: document.getElementById('author').value.trim(),
            pages: parseInt(document.getElementById('pages').value) || 0,
            year: parseInt(document.getElementById('year').value) || 0
        };

        try {
            const response = await fetch(`/api/books/${isbn}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedBook)
            });

            if (response.ok) {
                messageDiv.className = 'success';
                messageDiv.innerHTML = '✅ Книга успешно обновлена! Переход на главную...';
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } else {
                const error = await response.json();
                messageDiv.className = 'error';
                messageDiv.innerHTML = `❌ Ошибка: ${error.message || 'Не удалось обновить книгу'}`;
            }
        } catch (err) {
            messageDiv.className = 'error';
            messageDiv.innerHTML = '❌ Ошибка соединения с сервером';
        }
    });

    // Загружаем книгу при открытии страницы
    if (isbn) {
        loadBook();
    } else {
        bookInfoDiv.className = 'error';
        bookInfoDiv.innerHTML = '❌ ISBN не указан';
    }
</script>
</body>
</html>
