<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека | CRUD приложение</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-add {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }
        .btn-edit {
            background: #ffc107;
            color: #333;
        }
        .btn-delete {
            background: #dc3545;
            color: white;
        }
        .btn-save {
            background: #667eea;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #667eea;
            color: white;
        }
        input, select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin: 5px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 Библиотека</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('books')">📖 Книги</button>
        <button class="tab-btn" onclick="showTab('readers')">👥 Читатели</button>
    </div>

    <div id="books-tab" class="tab-content active">
        <div class="actions">
            <button class="btn btn-add" onclick="openBookModal()">➕ Добавить книгу</button>
            <input type="text" id="bookFilter" placeholder="🔍 Поиск..." oninput="loadBooks()">
            <select id="bookSort" onchange="loadBooks()">
                <option value="">Без сортировки</option>
                <option value="name">По названию ↑</option>
                <option value="-name">По названию ↓</option>
                <option value="year">По году ↑</option>
                <option value="-year">По году ↓</option>
            </select>
        </div>
        <div id="books-list"></div>
        <div id="bookPagination"></div>
    </div>

    <div id="readers-tab" class="tab-content">
        <div class="actions">
            <button class="btn btn-add" onclick="openReaderModal()">➕ Добавить читателя</button>
            <input type="text" id="readerFilter" placeholder="🔍 Поиск..." oninput="loadReaders()">
        </div>
        <div id="readers-list"></div>
    </div>
</div>

<div id="bookModal" class="modal">
    <div class="modal-content">
        <h2 id="bookModalTitle">Добавить книгу</h2>
        <form id="bookForm">
            <div class="form-group">
                <label>ISBN</label>
                <input type="text" id="bookIsbn" required>
            </div>
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="bookName" required>
            </div>
            <div class="form-group">
                <label>Автор</label>
                <input type="text" id="bookAuthor" required>
            </div>
            <div class="form-group">
                <label>Страницы</label>
                <input type="number" id="bookPages">
            </div>
            <div class="form-group">
                <label>Год</label>
                <input type="number" id="bookYear">
            </div>
            <button type="submit" class="btn btn-save">💾 Сохранить</button>
            <button type="button" class="btn" onclick="closeBookModal()">Отмена</button>
        </form>
    </div>
</div>

<script>
    let currentPage = 1;
    let editingBookIsbn = null;

    // ==================== ВКЛАДКИ ====================
    function showTab(tab) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`${tab}-tab`).classList.add('active');
        event.target.classList.add('active');
        if (tab === 'books') loadBooks();
        else loadReaders();
    }

    // ==================== КНИГИ ====================
    async function loadBooks() {
        const filter = document.getElementById('bookFilter').value;
        const sort = document.getElementById('bookSort').value;
        const response = await fetch(`/api/books?page=${currentPage}&take=10&sort=${sort}&filter=${filter}`);
        const data = await response.json();
        
        const tbody = document.getElementById('books-list');
        if (!data.data || data.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">Нет книг</td></tr>';
            return;
        }
        
        tbody.innerHTML = `
            <table>
                <thead><tr><th>ISBN</th><th>Название</th><th>Автор</th><th>Страницы</th><th>Год</th><th>Действия</th></tr></thead>
                <tbody>
                    ${data.data.map(book => `
                        <tr>
                            <td>${book.isbn}</td>
                            <td>${book.name}</td>
                            <td>${book.author}</td>
                            <td>${book.pages}</td>
                            <td>${book.year}</td>
                            <td>
                                <button class="btn btn-edit" onclick="editBook('${book.isbn}')">✏️</button>
                                <button class="btn btn-delete" onclick="deleteBook('${book.isbn}')">🗑️</button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
        
        const totalPages = Math.ceil(data.total / 10);
        document.getElementById('bookPagination').innerHTML = `
            <button ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">←</button>
            <span>Страница ${currentPage} из ${totalPages}</span>
            <button ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">→</button>
        `;
    }

    function changePage(page) {
        currentPage = page;
        loadBooks();
    }

    function openBookModal(book = null) {
        if (book) {
            editingBookIsbn = book.isbn;
            document.getElementById('bookModalTitle').innerText = 'Редактировать книгу';
            document.getElementById('bookIsbn').value = book.isbn;
            document.getElementById('bookIsbn').disabled = true;
            document.getElementById('bookName').value = book.name;
            document.getElementById('bookAuthor').value = book.author;
            document.getElementById('bookPages').value = book.pages;
            document.getElementById('bookYear').value = book.year;
        } else {
            editingBookIsbn = null;
            document.getElementById('bookModalTitle').innerText = 'Добавить книгу';
            document.getElementById('bookIsbn').disabled = false;
            document.getElementById('bookForm').reset();
        }
        document.getElementById('bookModal').style.display = 'flex';
    }

    function closeBookModal() {
        document.getElementById('bookModal').style.display = 'none';
    }

    async function editBook(isbn) {
        const response = await fetch(`/api/books/${isbn}`);
        const book = await response.json();
        openBookModal(book);
    }

    async function deleteBook(isbn) {
        if (confirm('Удалить книгу?')) {
            await fetch(`/api/books/${isbn}`, { method: 'DELETE' });
            loadBooks();
        }
    }

    document.getElementById('bookForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const book = {
            isbn: document.getElementById('bookIsbn').value,
            name: document.getElementById('bookName').value,
            author: document.getElementById('bookAuthor').value,
            pages: parseInt(document.getElementById('bookPages').value) || 0,
            year: parseInt(document.getElementById('bookYear').value) || 0
        };
        
        if (editingBookIsbn) {
            await fetch(`/api/books/${editingBookIsbn}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(book)
            });
        } else {
            await fetch('/api/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(book)
            });
        }
        closeBookModal();
        loadBooks();
    });

    // ==================== ЧИТАТЕЛИ ====================
    async function loadReaders() {
        const filter = document.getElementById('readerFilter').value;
        const response = await fetch(`/api/readers?take=100&filter=${filter}`);
        const readers = await response.json();
        
        const div = document.getElementById('readers-list');
        if (!readers.length) {
            div.innerHTML = '<p>Нет читателей</p>';
            return;
        }
        
        div.innerHTML = `
            <table>
                <thead><tr><th>№</th><th>Имя</th><th>Дата рождения</th><th>Книг на руках</th><th>Действия</th></tr></thead>
                <tbody>
                    ${readers.map(reader => `
                        <tr>
                            <td>${reader.readerNumber}</td>
                            <td>${reader.name}</td>
                            <td>${new Date(reader.birthday).toLocaleDateString()}</td>
                            <td>${reader.bookIsbns?.length || 0}</td>
                            <td>
                                <button class="btn btn-edit" onclick="editReader('${reader.id}')">✏️</button>
                                <button class="btn btn-delete" onclick="deleteReader('${reader.id}')">🗑️</button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    function openReaderModal(reader = null) {
        // упрощённо: alert, что функция в разработке
        alert('Редактирование читателей в разработке');
    }

    async function editReader(id) {
        alert('Редактирование читателей в разработке');
    }

    async function deleteReader(id) {
        if (confirm('Удалить читателя?')) {
            await fetch(`/api/readers/${id}`, { method: 'DELETE' });
            loadReaders();
        }
    }

    loadBooks();
</script>
</body>
</html>
