<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить книгу | Библиотека</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        h1::before {
            content: "📚 ";
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }

        .btn-add {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .btn-back {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            color: white;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 30px;
        }

        .form-actions .btn {
            flex: 1;
            text-align: center;
        }

        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
        }

        #message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        #message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .required {
            color: #dc3545;
            margin-left: 5px;
        }

        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Добавление книги</h1>
    <div class="subtitle">✨ Заполните информацию о новой книге ✨</div>

    <form id="add-form">
        <div class="form-group">
            <label>📖 ISBN <span class="required">*</span></label>
            <input type="text" id="isbn" placeholder="Например: 978-5-699-12345-6" required>
            <div class="hint">Уникальный идентификатор книги</div>
        </div>

        <div class="form-group">
            <label>📚 Название <span class="required">*</span></label>
            <input type="text" id="name" placeholder="Введите название книги" required>
        </div>

        <div class="form-group">
            <label>✍️ Автор <span class="required">*</span></label>
            <input type="text" id="author" placeholder="Введите автора" required>
        </div>

        <div class="form-group">
            <label>📄 Количество страниц</label>
            <input type="number" id="pages" placeholder="Например: 350">
        </div>

        <div class="form-group">
            <label>📅 Год издания</label>
            <input type="number" id="year" placeholder="Например: 2020">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-add">💾 Сохранить книгу</button>
            <a href="/" class="btn btn-back">🏠 На главную</a>
        </div>
    </form>

    <div id="message"></div>
</div>

<script>
    const form = document.getElementById('add-form');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const isbn = document.getElementById('isbn').value.trim();
        const name = document.getElementById('name').value.trim();
        const author = document.getElementById('author').value.trim();
        const pages = parseInt(document.getElementById('pages').value) || 0;
        const year = parseInt(document.getElementById('year').value) || 0;

        const book = { isbn, name, author, pages, year };

        try {
            const response = await fetch('/api/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(book)
            });

            if (response.ok) {
                messageDiv.className = 'success';
                messageDiv.innerHTML = '✅ Книга успешно добавлена! Переход на главную...';
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } else {
                const error = await response.json();
                messageDiv.className = 'error';
                messageDiv.innerHTML = `❌ Ошибка: ${error.message || 'Не удалось добавить книгу'}`;
            }
        } catch (err) {
            messageDiv.className = 'error';
            messageDiv.innerHTML = '❌ Ошибка соединения с сервером';
        }
    });
</script>
</body>
</html>
